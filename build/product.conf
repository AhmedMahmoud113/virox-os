# Product identity. The single place where the name, version and update host live.
# Read by tools/build.sh (-> CONFIG_VERSION_*) and by the lg7200-base package build.
# Rules: PRODUCT_NAME must not contain "LG", "OpenWrt" or any reseller name.
PRODUCT_NAME="Virox"
PRODUCT_SYSTEM_NAME="Virox OS"
PRODUCT_SSID_PREFIX="Virox-"
PRODUCT_HOSTNAME="Virox"
PRODUCT_VERSION="0.9.0-rc3.1"
# Q2 (hosting), owner 2026-11-19: GitHub Releases of the public repository virox-os.
# a fixed release named "updates" (owner 2026-11-22): .../releases/latest/download skips pre-releases
# (rc), so no unit found an update; tools/publish-updates.sh puts latest.json, its .sig and the image there
UPDATE_BASE_URL="https://github.com/AhmedMahmoud113/virox-os/releases/download/updates"
# Official userspace feeds for the same release (B4.7 split).
OPENWRT_BASE_TAG="v25.12.6"
OPENWRT_FEEDS_URL="https://downloads.openwrt.org/releases/25.12.6/packages/mipsel_24kc"
SOURCE_URL="https://github.com/AhmedMahmoud113/virox-os"
# Product LAN default (Q12 open)
DEFAULT_LAN_IP="192.168.72.1"
DEFAULT_LAN_CANDIDATES="192.168.72.1 192.168.73.1 10.72.0.1 172.30.72.1"
DEFAULT_COUNTRY="EG"
DEFAULT_TIMEZONE="EET-2EEST,M4.5.5/0,M10.5.4/24"   # = LuCI zoneinfo Africa/Cairo; DST ends the last Thursday of October at 24:00
DEFAULT_ZONENAME="Africa/Cairo"
# Owner question Q5 (Wi-Fi on first boot): 1 = on with a random per-unit key
WIFI_DEFAULT_ON=1
